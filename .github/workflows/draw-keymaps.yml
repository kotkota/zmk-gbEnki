name: Draw ZMK keymaps
on:
  workflow_dispatch: # can be triggered manually
  push: # automatically run on changes to following paths
    paths:
      - "config/*.keymap"
      # - "config/*.dtsi"
      - "keymap-drawer/config.yaml"
      # - 'boards/*/*/*.keymap'
      - .github/workflows/draw-keymaps.yml

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write # allow workflow to commit to the repo
    with:
      keymap_patterns: "config/*.keymap"
      config_path: "keymap-drawer/config.yaml"
      output_folder: "keymap-drawer"
      parse_args: ""
      draw_args: "-j gbEnki.json -s Default Russian 'Num / Nav' 'FN / Sym' Shortcuts 'Sticky mods' System"
#
# keymap -c config.yaml parse -z ../config/gbEnki.keymap > gbEnki.yaml
#
# keymap -c config.yaml draw gbEnki.yaml > gbEnki.svg -j gbEnki.json -s Default Russian "Num / Nav" "FN / Sym" Shortcuts "Sticky mods" System
