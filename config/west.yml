manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # - name: urob
    #   url-base: https://github.com/urob

    # zmk module for PS/2 mouse / TP driver
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: filippor
      url-base: https://github.com/filippor

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # trackpoint
